# Local development stack for Phylax.
#
# Services:
#   miner       — runs the 3-layer pipeline against incoming validator queries
#   validator   — runs its own baseline pipeline, scores miners, sets weights,
#                 publishes consensus SSSAs to the registry
#   api         — exposes the validator's registry over REST (POST /v1/scan,
#                 GET /v1/attestation/{hash})
#
# Both miner and validator require the host Docker socket because they
# shell out to docker to launch the phylax-sandbox image for detonation.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up --build

services:

  miner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miner
    image: phylax-miner:dev
    container_name: phylax-miner
    env_file: ../.env
    environment:
      - PHYLAX_LOG_LEVEL=DEBUG
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/opt/phylax
    ports:
      - "8091:8091"
    command: >
      python neurons/miner.py
      --netuid ${PHYLAX_NETUID:-1}
      --subtensor.network ${SUBTENSOR_NETWORK:-test}
      --wallet.name ${WALLET_NAME:-miner}
      --wallet.hotkey ${WALLET_HOTKEY:-default}
      --axon.port 8091
      --logging.debug

  validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.validator
    image: phylax-validator:dev
    container_name: phylax-validator
    env_file: ../.env
    environment:
      - PHYLAX_LOG_LEVEL=DEBUG
      - PHYLAX_REGISTRY_PATH=/opt/phylax/state/phylax_registry.sqlite3
      - PHYLAX_SANDBOX_IMAGE=phylax-sandbox:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/opt/phylax
      - phylax-state:/opt/phylax/state
    depends_on:
      - miner
    command: >
      python neurons/validator.py
      --netuid ${PHYLAX_NETUID:-1}
      --subtensor.network ${SUBTENSOR_NETWORK:-test}
      --wallet.name ${WALLET_NAME_VAL:-validator}
      --wallet.hotkey ${WALLET_HOTKEY:-default}
      --logging.debug

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.validator
    image: phylax-validator:dev
    container_name: phylax-api
    env_file: ../.env
    environment:
      - PHYLAX_LOG_LEVEL=INFO
      - PHYLAX_REGISTRY_PATH=/opt/phylax/state/phylax_registry.sqlite3
      - PHYLAX_API_HOST=0.0.0.0
      - PHYLAX_API_PORT=8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/opt/phylax
      - phylax-state:/opt/phylax/state
    depends_on:
      - validator
    ports:
      - "8080:8080"
    command: python -m phylax.api.server

volumes:
  phylax-state:

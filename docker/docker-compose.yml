services:

  miner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miner
    image: phylax-miner:dev
    container_name: phylax-miner
    env_file: ../.env
    environment:
      - PHYLAX_TRACK=${PHYLAX_TRACK:-skills}
      - PHYLAX_LOG_LEVEL=DEBUG
      - PHYLAX_SERVER_URL=${PHYLAX_SERVER_URL:-}
      - PHYLAX_SERVER_HOTKEY=${PHYLAX_SERVER_HOTKEY:-}
      - PHYLAX_EXECUTOR=${PHYLAX_EXECUTOR:-sandbox}
      - PHYLAX_AXON_PORT=${PHYLAX_AXON_PORT:-8091}
      - PHYLAX_AXON_EXTERNAL_IP=${PHYLAX_AXON_EXTERNAL_IP:-}
    volumes:
      - ../:/opt/phylax
    networks:
      - egress
    ports:
      - "${PHYLAX_AXON_PORT:-8091}:${PHYLAX_AXON_PORT:-8091}"
    command: >
      python neurons/miner.py
      --netuid ${PHYLAX_NETUID:-76}
      --subtensor.network ${SUBTENSOR_NETWORK:-finney}
      --wallet.name ${WALLET_NAME:-miner}
      --wallet.hotkey ${WALLET_HOTKEY:-default}
      --axon.port ${PHYLAX_AXON_PORT:-8091}
      --logging.debug

  validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.validator
    image: phylax-validator:dev
    container_name: phylax-validator
    env_file: ../.env
    environment:
      - PHYLAX_TRACK=${PHYLAX_TRACK:-skills}
      - PHYLAX_LOG_LEVEL=DEBUG
      - PHYLAX_SERVER_URL=${PHYLAX_SERVER_URL:-}
      - PHYLAX_SERVER_HOTKEY=${PHYLAX_SERVER_HOTKEY:-}
      - PHYLAX_VALIDATOR_LABEL=${PHYLAX_VALIDATOR_LABEL:-}
      - PHYLAX_EXECUTOR=${PHYLAX_EXECUTOR:-sandbox}
      - PHYLAX_JAIL_NETWORK=phylax-jail
      - PHYLAX_INFERENCE_PROXY_URL=${PHYLAX_INFERENCE_PROXY_URL:-http://phylax-proxy:8900}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/opt/phylax
    depends_on:
      - miner
    networks:
      - egress
    command: >
      python neurons/validator.py
      --netuid ${PHYLAX_NETUID:-76}
      --subtensor.network ${SUBTENSOR_NETWORK:-finney}
      --wallet.name ${WALLET_NAME_VAL:-validator}
      --wallet.hotkey ${WALLET_HOTKEY:-default}
      --logging.debug

  inference-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    image: phylax-proxy:dev
    container_name: phylax-proxy
    environment:
      - PHYLAX_PROXY_HOST=0.0.0.0
      - PHYLAX_PROXY_PORT=8900
    networks:
      - phylax-jail
      - egress

networks:
  egress:
    driver: bridge
  phylax-jail:
    name: phylax-jail
    driver: bridge
    internal: true

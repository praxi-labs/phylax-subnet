[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phylax-subnet"
version = "0.1.0"
description = "Decentralized trust layer for AI agent skills (Bittensor subnet)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Phylax contributors" }
]
keywords = ["bittensor", "subnet", "ai-safety", "agent-security", "sbom", "sandbox"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
dynamic = ["dependencies"]

[project.scripts]
phylax-miner = "neurons.miner:main"
phylax-validator = "neurons.validator:main"
phylax-api = "phylax.api.server:main"
phylax = "phylax.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
exclude = ["tests*", "corpora*", "docker*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines OK in docstrings

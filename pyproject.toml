[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phylax-subnet"
version = "0.1.0"
description = "Decentralized trust layer for AI agent skills (Bittensor subnet)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Phylax contributors" }
]
keywords = ["bittensor", "subnet", "ai-safety", "agent-security", "sbom", "sandbox"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
dynamic = ["dependencies"]

[project.scripts]
phylax-validator = "neurons.validator:main"
phylax-api = "phylax.api.server:main"
phylax = "phylax.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
exclude = ["tests*", "corpora*", "docker*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# corpora/ holds deliberately malicious and vulnerable fixtures (install-hook
# packages, SQL injection apps, credential stealers). They must never be linted
# or auto-fixed; "fixing" them would destroy the known-bad samples agents score.
extend-exclude = ["corpora"]

[tool.ruff.lint]
# Bandit-style "S" rules guard the subnet against regressions on the
# same security invariants the codebase already holds:
#   S608 — hardcoded SQL (registry.py uses raw sqlite3 with parameter
#          binding; this rule fails the build if anyone introduces an
#          f-string SQL query)
#   S301 — unsafe deserialization formats
#   S324 — weak hashes for security
#   S605 — starting a process with a shell (real shell-injection guard)
#   S701 — Jinja autoescape off
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",  # long lines OK in docstrings
    "S101",  # assert is fine in tests
    "S104",  # binding 0.0.0.0 inside the axon container is intentional
    "S311",  # `random` is OK for non-crypto sampling (corpus / synth)
    "S603",  # subprocess without shell=True is the safe form (validator
             # baseline calls `docker run` with a list of args)
    "S607",  # partial-path tool invocation (`docker`, `syft`) is fine —
             # we rely on PATH and trust the host
    "B008",  # FastAPI requires Depends() / Body() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately exercise edge cases that look suspicious to ruff,
# and corpora/ examples contain literal adversarial code snippets.
"tests/**" = ["S105", "S106", "S108"]
"corpora/**" = ["S105", "S106", "S108"]
# The scanner pipeline is best-effort by design: a malformed dependency
# file, a missing optional tool, or an unreadable script must never
# crash a scan, so silent skip / continue is the contract. The
# `# noqa: BLE001` annotations on these except blocks already document
# the intent. S110/S112 would add noise without catching real bugs.
"phylax/pipeline/**" = ["S110", "S112"]
"phylax/api/server.py" = ["S110"]  # countersign best-effort
"docker/harness/**" = ["S110"]     # entry-point probing

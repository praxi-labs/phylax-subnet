# Canonical phylax-miner deployment. Operators run:
#
#   cd ~/phylax/miner
#   docker compose pull
#   docker compose up -d
#
# Configuration lives in ./.env next to this file. The bootstrap script at
# scripts/install.sh seeds .env with sensible defaults (including the host
# UID/GID needed for the sandbox bind mount to be writable).

services:
  phylax-miner:
    image: ghcr.io/praxi-labs/phylax-miner:${PHYLAX_IMAGE_TAG:-latest}
    container_name: phylax-miner
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "${AXON_PORT:-8091}:8091"
    volumes:
      # Wallet hotkey (read-only) — needed to sign SSSAs
      - ${BITTENSOR_DIR:-~/.bittensor}:/root/.bittensor:ro
      # Docker socket — miner shells out to docker run to launch the sandbox
      - /var/run/docker.sock:/var/run/docker.sock
      # Per-scan evidence dir — also bind-mounted by the sandbox container,
      # so it must be writable to the same UID the sandbox runs as
      - ./evidence:/opt/phylax/evidence
    environment:
      # Force HOME so ~ expands to /root inside the container even when the
      # process runs as a UID that has no /etc/passwd entry (--user 1000:1000).
      # Without this, bittensor's settings.py tries to mkdir /.bittensor and
      # crashes with PermissionError.
      HOME: /root
    env_file:
      - .env
    command:
      - python
      - neurons/miner.py
      - --netuid
      - "${PHYLAX_NETUID:-486}"
      - --subtensor.network
      - "${SUBTENSOR_NETWORK:-test}"
      - --wallet.name
      - "${WALLET_NAME:-miner}"
      - --wallet.hotkey
      - "${WALLET_HOTKEY:-default}"
      - --axon.port
      - "8091"
      - --logging.debug

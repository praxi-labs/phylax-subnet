services:
  phylax-validator:
    image: ghcr.io/praxi-labs/phylax-validator:${PHYLAX_IMAGE_TAG:-latest}
    container_name: phylax-validator
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - ${BITTENSOR_DIR:-~/.bittensor}:/opt/phylax/.bittensor
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HOME: /opt/phylax
      PHYLAX_TRACK: "${PHYLAX_TRACK:-skills}"
      PHYLAX_SERVER_URL: "${PHYLAX_SERVER_URL:-}"
      PHYLAX_SERVER_HOTKEY: "${PHYLAX_SERVER_HOTKEY:-}"
      PHYLAX_VALIDATOR_LABEL: "${PHYLAX_VALIDATOR_LABEL:-}"
      PHYLAX_EXECUTOR: "${PHYLAX_EXECUTOR:-docker}"
      PHYLAX_JAIL_NETWORK: "phylax-jail"
      PHYLAX_INFERENCE_PROXY_URL: "${PHYLAX_INFERENCE_PROXY_URL:-http://phylax-proxy:8900}"
      # Validator-owned sandbox image: miner code runs inside THIS, never a miner image.
      PHYLAX_SANDBOX_IMAGE: "${PHYLAX_SANDBOX_IMAGE:-ghcr.io/praxi-labs/phylax-agent:${PHYLAX_IMAGE_TAG:-latest}}"
      PHYLAX_SANDBOX_DIGEST: "${PHYLAX_SANDBOX_DIGEST:-}"
      # Shared with the proxy so the validator can read per-task inference liveness.
      PHYLAX_PROXY_ADMIN_TOKEN: "${PHYLAX_PROXY_ADMIN_TOKEN:-}"
    env_file:
      - .env
    networks:
      - egress
    command:
      - python
      - neurons/validator.py
      - --netuid
      - "${PHYLAX_NETUID:-486}"
      - --subtensor.network
      - "${SUBTENSOR_NETWORK:-test}"
      - --wallet.name
      - "${WALLET_NAME:-validator}"
      - --wallet.hotkey
      - "${WALLET_HOTKEY:-default}"
      - --logging.debug

  inference-proxy:
    image: ghcr.io/praxi-labs/phylax-proxy:${PHYLAX_IMAGE_TAG:-latest}
    container_name: phylax-proxy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      PHYLAX_PROXY_HOST: "0.0.0.0"
      PHYLAX_PROXY_PORT: "8900"
      PHYLAX_PROXY_ADMIN_TOKEN: "${PHYLAX_PROXY_ADMIN_TOKEN:-}"
    networks:
      - phylax-jail
      - egress

  watchtower:
    image: containrrr/watchtower:latest
    container_name: phylax-watchtower
    restart: unless-stopped
    profiles: ["auto-update"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "false"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-120}"
      DOCKER_API_VERSION: "${DOCKER_API_VERSION:-1.41}"
      TZ: "UTC"

networks:
  egress:
    driver: bridge
  phylax-jail:
    name: phylax-jail
    driver: bridge
    internal: true

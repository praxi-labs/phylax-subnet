# Canonical phylax-validator deployment. Operators run:
#
#   cd ~/phylax/validator
#   docker compose pull
#   docker compose up -d
#
# Configuration lives in ./.env next to this file. The bootstrap script at
# scripts/install.sh seeds .env with sensible defaults (including the host
# UID/GID needed for the sandbox bind mount to be writable) and prompts for
# the phylax-server URL + pinned server hotkey.

services:
  phylax-validator:
    image: ghcr.io/praxi-labs/phylax-validator:${PHYLAX_IMAGE_TAG:-latest}
    container_name: phylax-validator
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Add the host's docker group so the container UID can open
    # /var/run/docker.sock — BaselineRunner shells out to docker run for
    # ground-truth detonation, and without socket access it produces no
    # evidence hashes, dragging every miner's evidence_score to 0.
    # install.sh detects the GID from `getent group docker` and writes it
    # to .env.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      # Wallet hotkey — needed to sign SSSAs and call set_weights. Mounted
      # read-write because bittensor's settings.py calls
      # WALLETS_DIR.mkdir(exist_ok=True) at import time, and a :ro mount
      # makes even the no-op mkdir on the existing dir raise PermissionError.
      # Mounted under /opt/phylax so the non-root container user can traverse
      # the parent dir (/root would be 700-root and unreachable).
      - ${BITTENSOR_DIR:-~/.bittensor}:/opt/phylax/.bittensor
      # Docker socket — BaselineRunner shells out to docker run for ground-truth detonation
      - /var/run/docker.sock:/var/run/docker.sock
      # Per-scan evidence dir — also bind-mounted by the sandbox container
      - ./evidence:/opt/phylax/evidence
      # Attestation registry — must persist across restarts
      - ./registry.sqlite3:/opt/phylax/registry.sqlite3
    environment:
      # Force HOME because the process runs as a UID with no /etc/passwd
      # entry (--user 1000:1000), so ~ would otherwise resolve to /. We
      # use /opt/phylax (already 755 in the image) instead of /root so
      # the non-root container user can traverse it and reach the
      # bind-mounted wallet under ~/.bittensor.
      HOME: /opt/phylax
    env_file:
      - .env
    command:
      - python
      - neurons/validator.py
      - --netuid
      - "${PHYLAX_NETUID:-486}"
      - --subtensor.network
      - "${SUBTENSOR_NETWORK:-test}"
      - --wallet.name
      - "${WALLET_NAME:-validator}"
      - --wallet.hotkey
      - "${WALLET_HOTKEY:-default}"
      - --logging.debug

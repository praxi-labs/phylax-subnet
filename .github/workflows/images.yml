name: Images

# Build and publish the three subnet images to GitHub Container Registry on
# every push to main. Validators pull from ghcr.io instead of cloning the repo
# and running docker build by hand. Miners are submit only and need no image.
#
#   phylax-validator  pulled by the validator deploy (the neuron)
#   phylax-agent      the VALIDATOR-OWNED sandbox; the executor docker-pulls it
#                     on every agent run (PHYLAX_SANDBOX_IMAGE)
#   phylax-proxy      the metered inference proxy in the validator deploy
#
# Each image is tagged with:
#   - latest         (only when built from main)
#   - sha-<short>    (always — for reproducible deploys)
#   - <tag>          (when pushed as a v* tag — for releases)
#
# Packages default to private on first publish. Every one of the three MUST be
# flipped to Public at
#   https://github.com/orgs/praxi-labs/packages
# or miners and validators cannot pull without auth. In particular a validator
# host with no GHCR login FAILS every evaluation if phylax-agent or phylax-proxy
# is still private — the executor's `docker pull` of the sandbox image errors out.
# (phylax-sandbox is the retired pre-code-only name and is no longer built here.)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: validator, dockerfile: docker/Dockerfile.validator }
          - { name: agent,     dockerfile: docker/Dockerfile.agent }
          - { name: proxy,     dockerfile: docker/Dockerfile.proxy }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/phylax-${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
